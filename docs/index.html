<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Code Reviewer - Get instant AI-powered code reviews with security analysis, performance tips, and best practice suggestions.">
    <meta name="keywords" content="code review, AI, code analysis, security, performance, best practices, OpenAI, Ollama, Claude">
    <meta name="author" content="yoon-k">
    <meta property="og:title" content="AI Code Reviewer | OpenWebUI + LLM">
    <meta property="og:description" content="AI-powered code review tool with security analysis and improvement suggestions">
    <meta property="og:type" content="website">
    <title>AI Code Reviewer | Interactive Demo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔍%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #16161f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.08);
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
            --gradient-glow: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-size: 2rem; }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .api-connection {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-input {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.85rem;
            width: 200px;
        }

        .api-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: var(--shadow-glow);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.connected { background: var(--success); }
        .status-dot.simulation { background: var(--warning); }

        .lang-selector {
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            padding: 6px 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--gradient-primary);
            border-color: transparent;
            color: white;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            min-height: calc(100vh - 80px);
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .panel-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 4px;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--gradient-primary);
            border-color: transparent;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .form-select option {
            background: var(--bg-secondary);
        }

        .code-editor {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            resize: vertical;
            line-height: 1.5;
        }

        .code-editor:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .focus-areas {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .focus-area {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .focus-area:hover {
            border-color: var(--accent-primary);
        }

        .focus-area.active {
            background: var(--gradient-glow);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }

        .result-container {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            min-height: 400px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-actions {
            display: flex;
            gap: 8px;
        }

        .score-section {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--bg-primary);
            border-radius: 50%;
        }

        .score-value {
            position: relative;
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-details {
            flex: 1;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .score-summary {
            font-size: 1rem;
            font-weight: 500;
        }

        .score-breakdown {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }

        .score-item {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-item.critical { color: var(--error); }
        .score-item.high { color: var(--warning); }
        .score-item.medium { color: var(--info); }
        .score-item.low { color: var(--success); }

        .issues-section {
            margin-bottom: 24px;
        }

        .issues-section h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-primary);
        }

        .issue-item {
            padding: 16px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            border-left: 4px solid var(--warning);
        }

        .issue-item.critical { border-left-color: var(--error); }
        .issue-item.high { border-left-color: var(--warning); }
        .issue-item.medium { border-left-color: var(--info); }
        .issue-item.low { border-left-color: var(--success); }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .issue-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .severity-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-badge.critical {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .severity-badge.high {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .severity-badge.medium {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
        }

        .severity-badge.low {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .issue-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .issue-suggestion {
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 300px;
        }

        .chat-message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
        }

        .chat-message.user {
            background: var(--gradient-primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .preset-card {
            padding: 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .preset-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .preset-card-icon {
            font-size: 1.5rem;
        }

        .preset-card-title {
            font-weight: 600;
        }

        .preset-card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 100px;
            right: 24px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--error); }
        .notification.info { border-left: 4px solid var(--info); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .history-item {
            padding: 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent-primary);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .history-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .history-item-score {
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .history-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
            }

            .api-connection {
                flex-direction: column;
                width: 100%;
            }

            .api-input {
                width: 100%;
            }

            .lang-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🔍</span>
                <h1 id="logoTitle">AI Code Reviewer</h1>
            </div>
            <div class="header-controls">
                <div class="api-connection">
                    <input type="text" id="apiUrl" class="api-input" placeholder="http://localhost:5000">
                    <button id="connectBtn" class="btn btn-primary" onclick="toggleConnection()">
                        <span id="connectBtnText">Connect</span>
                    </button>
                    <div class="connection-status">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Simulation</span>
                    </div>
                </div>
                <div class="lang-selector">
                    <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                    <button class="lang-btn" data-lang="ko" onclick="setLanguage('ko')">KO</button>
                    <button class="lang-btn" data-lang="ja" onclick="setLanguage('ja')">JA</button>
                    <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">ZH</button>
                    <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
                    <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">FR</button>
                    <button class="lang-btn" data-lang="de" onclick="setLanguage('de')">DE</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title" id="inputPanelTitle">CODE INPUT</span>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label class="form-label" id="languageLabel">Programming Language</label>
                    <select id="languageSelect" class="form-select">
                        <option value="auto">Auto Detect</option>
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="java">Java</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="cpp">C++</option>
                        <option value="c">C</option>
                        <option value="ruby">Ruby</option>
                        <option value="php">PHP</option>
                        <option value="swift">Swift</option>
                        <option value="kotlin">Kotlin</option>
                        <option value="sql">SQL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" id="codeLabel">Code</label>
                    <textarea id="codeInput" class="code-editor" placeholder="Paste your code here...">function getUserData(userId) {
  // SQL injection vulnerability
  const query = `SELECT * FROM users WHERE id = ${userId}`;

  const password = "admin123";

  return db.execute(query);
}</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" id="focusLabel">Focus Areas</label>
                    <div class="focus-areas" id="focusAreas"></div>
                </div>

                <button class="btn btn-primary btn-full" onclick="reviewCode()" id="reviewBtn">
                    <span>🔍</span>
                    <span id="reviewBtnText">Review Code</span>
                </button>

                <div style="margin-top: 24px;">
                    <label class="form-label" id="presetsLabel">Quick Presets</label>
                    <div id="presetsList"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title" id="resultPanelTitle">RESULTS</span>
                <div class="tabs">
                    <button class="tab active" data-tab="result" onclick="showTab('result')" id="tabResult">Result</button>
                    <button class="tab" data-tab="chat" onclick="showTab('chat')" id="tabChat">Chat</button>
                    <button class="tab" data-tab="history" onclick="showTab('history')" id="tabHistory">History</button>
                </div>
            </div>
            <div class="panel-body" style="padding: 0;">
                <!-- Result Tab -->
                <div id="resultTab" class="tab-content active" style="padding: 20px;">
                    <div id="resultContent">
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <h3 id="emptyTitle">No Review Yet</h3>
                            <p id="emptyDesc">Paste your code and click 'Review Code' to get started</p>
                        </div>
                    </div>
                </div>

                <!-- Chat Tab -->
                <div id="chatTab" class="tab-content chat-container">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="text" id="chatInput" class="chat-input" placeholder="Ask about this code..." onkeypress="handleChatKeypress(event)">
                        <button class="btn btn-primary" onclick="sendChatMessage()" id="sendBtn">
                            <span id="sendBtnText">Send</span>
                        </button>
                    </div>
                </div>

                <!-- History Tab -->
                <div id="historyTab" class="tab-content" style="padding: 20px;">
                    <div id="historyList">
                        <div class="empty-state">
                            <div class="empty-state-icon">📜</div>

        // Functions
        function setLanguage(lang) {
            currentLang = lang;
            const texts = i18n[lang];

            Object.keys(texts).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.textContent = texts[key];
                }
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            localStorage.setItem('code-reviewer-lang', lang);
            renderFocusAreas();
            renderPresets();

            if (currentResult) {
                renderResult(currentResult);
            }
        }

        function getText(key) {
            return i18n[currentLang][key] || i18n['en'][key] || key;
        }

        async function toggleConnection() {
            const url = document.getElementById('apiUrl').value.trim();

            if (isConnected) {
                isConnected = false;
                apiBaseUrl = '';
                localStorage.removeItem('code-reviewer-api');
                updateConnectionStatus();
                return;
            }

            if (!url) {
                showNotification('Please enter API URL', 'error');
                return;
            }

            try {
                const response = await fetch(`${url}/api/health`);
                if (response.ok) {
                    isConnected = true;
                    apiBaseUrl = url;
                    localStorage.setItem('code-reviewer-api', url);
                    showNotification(getText('connectionSuccess'), 'success');
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                isConnected = false;
                showNotification(getText('connectionFailed'), 'error');
            }

            updateConnectionStatus();
        }

        function updateConnectionStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const btn = document.getElementById('connectBtn');
            const btnText = document.getElementById('connectBtnText');

            if (isConnected) {
                dot.className = 'status-dot connected';
                text.textContent = getText('statusConnected');
                btn.className = 'btn btn-danger';
                btnText.textContent = getText('disconnectBtnText');
            } else {
                dot.className = 'status-dot simulation';
                text.textContent = getText('statusSimulation');
                btn.className = 'btn btn-primary';
                btnText.textContent = getText('connectBtnText');
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            document.getElementById(tabName + 'Tab').classList.add('active');
            document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
        }

        function renderFocusAreas() {
            const container = document.getElementById('focusAreas');
            container.innerHTML = focusAreas.map(area => `
                <div class="focus-area ${selectedFocusAreas.includes(area.id) ? 'active' : ''}"
                     onclick="toggleFocusArea('${area.id}')" data-area="${area.id}">
                    ${area.icon} ${area.name}
                </div>
            `).join('');
        }

        function toggleFocusArea(areaId) {
            if (selectedFocusAreas.includes(areaId)) {
                selectedFocusAreas = selectedFocusAreas.filter(a => a !== areaId);
            } else {
                selectedFocusAreas.push(areaId);
            }
            renderFocusAreas();
        }

        function renderPresets() {
            const container = document.getElementById('presetsList');
            container.innerHTML = presets.map(preset => `
                <div class="preset-card" onclick="usePreset('${preset.id}')">
                    <div class="preset-card-header">
                        <span class="preset-card-icon">${preset.icon}</span>
                        <span class="preset-card-title">${preset.name}</span>
                    </div>
                    <p class="preset-card-desc">${preset.areas.length} focus areas</p>
                </div>
            `).join('');
        }

        function usePreset(presetId) {
            const preset = presets.find(p => p.id === presetId);
            if (preset) {
                selectedFocusAreas = [...preset.areas];
                renderFocusAreas();
                showNotification(`Applied ${preset.name} preset`, 'info');
            }
        }

        async function reviewCode() {
            const code = document.getElementById('codeInput').value.trim();
            const language = document.getElementById('languageSelect').value;

            if (!code) {
                showNotification('Please enter code to review', 'error');
                return;
            }

            currentCode = code;
            showLoading();

            try {
                let result;
                if (isConnected) {
                    const response = await fetch(`${apiBaseUrl}/api/review`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code,
                            language,
                            focus_areas: selectedFocusAreas
                        })
                    });
                    result = await response.json();
                } else {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    result = simulationResponse;
                }

                currentResult = result;
                renderResult(result);
                addToHistory(code, result);
                showTab('result');
            } catch (error) {
                showNotification('Error reviewing code: ' + error.message, 'error');
            }
        }

        function showLoading() {
            document.getElementById('resultContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            `;
        }

        function renderResult(result) {
            const container = document.getElementById('resultContent');
            const criticalCount = result.issues.filter(i => i.severity === 'critical').length;
            const highCount = result.issues.filter(i => i.severity === 'high').length;
            const mediumCount = result.issues.filter(i => i.severity === 'medium').length;
            const lowCount = result.issues.filter(i => i.severity === 'low').length;

            const scoreColor = result.score >= 80 ? 'var(--success)' :
                              result.score >= 60 ? 'var(--info)' :
                              result.score >= 40 ? 'var(--warning)' : 'var(--error)';

            container.innerHTML = `
                <div class="result-container">
                    <div class="result-header">
                        <div class="result-title">
                            <span>📊</span>
                            Review Results
                        </div>
                        <div class="result-actions">
                            <button class="btn btn-secondary" onclick="copyResult()">📋 Copy</button>
                            <button class="btn btn-secondary" onclick="exportMarkdown()">📄 Export</button>
                        </div>
                    </div>

                    <div class="score-section">
                        <div class="score-circle" style="background: conic-gradient(${scoreColor} ${result.score * 3.6}deg, var(--bg-tertiary) 0);">
                            <span class="score-value">${result.score}</span>
                        </div>
                        <div class="score-details">
                            <div class="score-label">${getText('scoreLabel')}</div>
                            <div class="score-summary">${result.issues.length} ${getText('issuesFound')}</div>
                            <div class="score-breakdown">
                                ${criticalCount ? `<span class="score-item critical">● ${criticalCount} ${getText('critical')}</span>` : ''}
                                ${highCount ? `<span class="score-item high">● ${highCount} ${getText('high')}</span>` : ''}
                                ${mediumCount ? `<span class="score-item medium">● ${mediumCount} ${getText('medium')}</span>` : ''}
                                ${lowCount ? `<span class="score-item low">● ${lowCount} ${getText('low')}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    ${result.summary ? `
                    <div class="issues-section">
                        <h4>📝 Summary</h4>
                        <p style="color: var(--text-secondary); line-height: 1.7;">${result.summary}</p>
                    </div>
                    ` : ''}

                    <div class="issues-section">
                        <h4>🔍 Issues Found</h4>
                        ${result.issues.map(issue => `
                            <div class="issue-item ${issue.severity}">
                                <div class="issue-header">
                                    <span class="issue-title">${issue.title}</span>
                                    <span class="severity-badge ${issue.severity}">${getText(issue.severity)}</span>
                                </div>
                                <p class="issue-description">${issue.description}</p>
                                ${issue.suggestion ? `
                                <div class="issue-suggestion">
                                    <strong>${getText('suggestion')}:</strong> ${issue.suggestion}
                                </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    ${result.recommendations && result.recommendations.length ? `
                    <div class="issues-section">
                        <h4>💡 Recommendations</h4>
                        <ul style="list-style: none;">
                            ${result.recommendations.map(rec => `
                                <li style="padding: 8px 0; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);">
                                    ✓ ${rec}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function copyResult() {
            if (!currentResult) return;

            let text = `# Code Review Results\n\n`;
            text += `**Score:** ${currentResult.score}/100\n\n`;
            if (currentResult.summary) text += `## Summary\n${currentResult.summary}\n\n`;
            text += `## Issues\n`;
            currentResult.issues.forEach(issue => {
                text += `### [${issue.severity.toUpperCase()}] ${issue.title}\n`;
                text += `${issue.description}\n`;
                if (issue.suggestion) text += `**Suggestion:** ${issue.suggestion}\n`;
                text += '\n';
            });

            navigator.clipboard.writeText(text);
            showNotification(getText('copySuccess'), 'success');
        }

        function exportMarkdown() {
            if (!currentResult) return;

            let text = `# Code Review Results\n\n`;
            text += `**Score:** ${currentResult.score}/100\n\n`;
            text += `**Date:** ${new Date().toISOString()}\n\n`;
            if (currentResult.summary) text += `## Summary\n${currentResult.summary}\n\n`;
            text += `## Issues Found\n`;
            currentResult.issues.forEach(issue => {
                text += `### [${issue.severity.toUpperCase()}] ${issue.title}\n`;
                text += `${issue.description}\n`;
                if (issue.suggestion) text += `**Suggestion:** ${issue.suggestion}\n`;
                text += '\n';
            });
            if (currentResult.recommendations) {
                text += `## Recommendations\n`;
                currentResult.recommendations.forEach(rec => {
                    text += `- ${rec}\n`;
                });
            }

            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code-review-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);

            showNotification(getText('exportSuccess'), 'success');
        }

        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            input.value = '';
            addChatMessage(message, 'user');

            try {
                let response;
                if (isConnected) {
                    const res = await fetch(`${apiBaseUrl}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message,
                            code: currentCode,
                            history: chatHistory.map(m => ({ role: m.role, content: m.content })),
                            language: currentLang
                        })
                    });
                    const data = await res.json();
                    response = data.response;
                } else {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const responses = [
                        "Based on the code review, the main issue is the SQL injection vulnerability. You should use parameterized queries instead of string interpolation.",
                        "The hardcoded password is a critical security risk. Store sensitive credentials in environment variables or use a secrets management service.",
                        "I recommend adding error handling with try-catch blocks to properly handle database errors and prevent information leakage.",
                        "Input validation is important for security. Validate the userId parameter before using it in the query.",
                        "For better code quality, consider adding TypeScript for type safety and JSDoc comments for documentation."
                    ];
                    response = responses[Math.floor(Math.random() * responses.length)];
                }

                addChatMessage(response, 'assistant');
            } catch (error) {
                addChatMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            }
        }

        function addChatMessage(content, role) {
            chatHistory.push({ role, content });

            const container = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = `chat-message ${role}`;
            messageEl.textContent = content;
            container.appendChild(messageEl);
            container.scrollTop = container.scrollHeight;
        }

        function addToHistory(code, result) {
            const item = {
                code: code.substring(0, 200),
                score: result.score,
                issues: result.issues.length,
                timestamp: new Date().toISOString(),
                result
            };

            reviewHistory.unshift(item);
            if (reviewHistory.length > 20) {
                reviewHistory.pop();
            }

            localStorage.setItem('code-reviewer-history', JSON.stringify(reviewHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');

            if (reviewHistory.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📜</div>
                        <h3>${getText('historyEmptyTitle')}</h3>
                        <p>${getText('historyEmptyDesc')}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = reviewHistory.map((item, index) => `
                <div class="history-item" onclick="loadHistoryItem(${index})">
                    <div class="history-item-header">
                        <span class="history-item-title">Review #${reviewHistory.length - index}</span>
                        <span class="history-item-score">${item.score}/100</span>
                    </div>
                    <p class="history-item-meta">${new Date(item.timestamp).toLocaleString()} • ${item.issues} issues</p>
                </div>
            `).join('');
        }

        function loadHistoryItem(index) {
            const item = reviewHistory[index];
            currentResult = item.result;
            renderResult(item.result);
            showTab('result');
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved settings
            const savedLang = localStorage.getItem('code-reviewer-lang');
            if (savedLang && i18n[savedLang]) {
                setLanguage(savedLang);
            }

            const savedApi = localStorage.getItem('code-reviewer-api');
            if (savedApi) {
                document.getElementById('apiUrl').value = savedApi;
            }

            const savedHistory = localStorage.getItem('code-reviewer-history');
            if (savedHistory) {
                try {
                    reviewHistory = JSON.parse(savedHistory);
                } catch (e) {}
            }

            renderFocusAreas();
            renderPresets();
            renderHistory();
            updateConnectionStatus();
        });
    </script>
</body>
</html>
